name: Bug Report
description: Report an issue, crash, or unexpected behavior in whatsapp-pro-bot
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.
        If this is a security vulnerability, please do NOT use this form; refer to [SECURITY.md](https://github.com/itsgoharrehman/whatsapp-pro-bot/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the issue.
      placeholder: |
        1. Start the bot via `node Anti_delete_bot.js`
        2. Send and delete a message
        3. Observe crash or failure
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Node.js version, OS, Baileys version.
      placeholder: |
        - Node.js Version: 18.x / 20.x
        - OS: Ubuntu 22.04 / Debian 12 / Windows 11
        - Bot Version: 2.0.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs
      description: Paste relevant terminal logs (ensure phone numbers and Telegram tokens are sanitized).