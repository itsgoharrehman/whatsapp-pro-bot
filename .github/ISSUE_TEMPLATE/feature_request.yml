name: Feature Request
description: Propose a new feature or improvement for whatsapp-pro-bot
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a new feature or operational enhancement.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is this feature related to a limitation or operational challenge?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Clear description of the proposed feature and implementation approach.
    validations:
      required: true
  - type: textarea
    id: protocol_impact
    attributes:
      label: Protocol and Operational Impact
      description: How does this affect Baileys socket connection or memory consumption?
    validations:
      required: true